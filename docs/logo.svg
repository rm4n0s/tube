<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: GPL-2.0-only -->
<!-- The logo of Tube: a cat that shoots paper bullets by blowing through a tube. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Tube</title>
  <desc id="desc">A cat with puffed cheeks blows through a tube, and three balls of crumpled paper fly out of it.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7dff"/>
      <stop offset="1" stop-color="#5b3fd1"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#ffc233"/>
      <stop offset="1" stop-color="#e09a00"/>
    </linearGradient>
    <!-- A ball of crumpled paper, about 40 across, around 0,0. -->
    <g id="wad">
      <path d="M-18,-6 L-9,-18 L4,-20 L16,-12 L20,2 L13,15 L-1,20 L-14,14 L-21,4 Z" fill="#ffffff" stroke="#2a2340" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-9,-18 L-3,-5 L16,-12 M-3,-5 L-14,14 M-3,-5 L5,6 L20,2 M5,6 L-1,20" fill="none" stroke="#b9b2d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#sky)"/>

  <g transform="translate(0,-20)">
  <!-- The paper bullets, on the line of the tube, with the lines of their speed. -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <path d="M368,266 L385,260"/>
    <path d="M382,314 L399,308"/>
    <path d="M416,250 L430,245"/>
    <path d="M427,292 L441,287"/>
  </g>
  <use href="#wad" transform="translate(403,282) rotate(-10) scale(1.05)"/>
  <use href="#wad" transform="translate(447,268) rotate(25) scale(0.82)"/>
  <use href="#wad" transform="translate(481,257) rotate(-30) scale(0.6)"/>

  <!-- The cat: ears, head, face. -->
  <g stroke="#2a2340" stroke-width="10" stroke-linejoin="round">
    <path d="M46,264 L50,138 L134,196 Z" fill="#ff9d3c"/>
    <path d="M174,192 L246,130 L264,248 Z" fill="#ff9d3c"/>
    <ellipse cx="152" cy="312" rx="122" ry="112" fill="#ff9d3c"/>
  </g>
  <path d="M66,226 L69,170 L108,198 Z" fill="#ffc7d6"/>
  <path d="M204,194 L236,164 L244,218 Z" fill="#ffc7d6"/>
  <!-- The stripes of the forehead. -->
  <g fill="none" stroke="#d9741a" stroke-width="10" stroke-linecap="round">
    <path d="M152,206 L152,236"/>
    <path d="M124,212 L130,236"/>
    <path d="M180,212 L174,236"/>
  </g>
  <!-- The muzzle and the puffed cheeks. -->
  <ellipse cx="178" cy="350" rx="80" ry="56" fill="#fff1dd"/>
  <circle cx="102" cy="346" r="19" fill="#ff7f8f" opacity="0.6"/>
  <circle cx="240" cy="300" r="16" fill="#ff7f8f" opacity="0.6"/>
  <!-- The eyes, shut tight with the effort. -->
  <g fill="none" stroke="#2a2340" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90,258 L122,273 L90,288"/>
    <path d="M224,250 L192,265 L224,280"/>
  </g>
  <!-- The whiskers. -->
  <g fill="none" stroke="#2a2340" stroke-width="5" stroke-linecap="round">
    <path d="M94,334 L36,320"/>
    <path d="M92,352 L30,356"/>
    <path d="M96,370 L40,392"/>
  </g>
  <!-- The nose. -->
  <path d="M164,306 L190,302 L179,319 Z" fill="#ff6f8b" stroke="#2a2340" stroke-width="5" stroke-linejoin="round"/>

  <!-- The tube, from the mouth to the upper right, and the paw that holds it. -->
  <g transform="translate(186,352) rotate(-18)" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="4" cy="0" rx="12" ry="23" fill="#2a2340"/>
    <rect x="4" y="-16" width="182" height="32" rx="5" fill="url(#pipe)" stroke="#2a2340" stroke-width="8"/>
    <g fill="none" stroke="#2a2340" stroke-width="5" opacity="0.5">
      <path d="M120,-13 L120,13"/>
      <path d="M154,-13 L154,13"/>
    </g>
    <!-- The open end. -->
    <ellipse cx="186" cy="0" rx="8" ry="16" fill="#2a2340"/>
    <path d="M44,48 C36,20 40,-18 56,-24 C72,-29 92,-24 94,-4 C96,16 94,34 88,48 C76,58 56,57 44,48 Z" fill="#ff9d3c" stroke="#2a2340" stroke-width="9"/>
    <path d="M60,-21 L60,-6 M76,-21 L76,-6" fill="none" stroke="#2a2340" stroke-width="6"/>
  </g>
  </g>
</svg>
